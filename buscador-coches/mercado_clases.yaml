# Perfil mercado: carrocería y clase de tamaño (segmentos europeos A–F; S = deportivo) por modelo, y vehículos comerciales.
# CRITERIO de clasificación (no es un dato de precio ni de fiabilidad): segmento europeo habitual del modelo (clase de
# tamaño según la Comisión Europea, Reglamento (CEE) 4064/89, caso M.1406 Hyundai/Kia, y uso de la prensa del motor).
# Se usa para asignar segmento a los anuncios que no lo traen (AutoScout24 no publica la carrocería en el listado) y como
# regresor del modelo hedónico de infravalorados. Reglas en orden: gana la primera que encaja con "marca modelo"
# normalizado (minúsculas, sin acentos, sin signos). [patrón, carrocería, clase]
# carrocería: turismo (hatchback o sedán) | familiar | suv | monovolumen | coupe | cabrio | comercial | pickup
comerciales:
  # siempre comerciales (furgones, derivados de furgoneta sin versión de pasajeros diferenciada, chasis): se excluyen de infravalorados
  siempre: ["\\bcitan\\b", "\\bkangoo\\b", "\\bvito\\b", "\\bsprinter\\b", "\\btransit\\b", "\\btourneo custom\\b", "renault master",
            "\\btrafic\\b", "\\bducato\\b", "\\bjumper\\b", "\\bboxer\\b", "\\bcrafter\\b", "\\bmovano\\b", "\\bdaily\\b",
            "\\btransporter\\b", "\\bproace\\b(?! (city )?verso)", "\\bvivaro\\b(?! life)", "peugeot expert\\b", "\\bjumpy\\b",
            "\\btalento\\b", "\\bnv ?[234]00\\b", "\\bprimastar\\b", "\\binterstar\\b", "\\btownstar\\b", "\\bexpress\\b",
            "\\bfiorino\\b", "\\bqubo\\b", "\\bnemo\\b", "\\bbipper\\b", "\\bdokker\\b", "\\bdoblo\\b", "\\bconnect\\b",
