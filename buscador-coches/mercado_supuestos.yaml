  diesel:   {utilitario: 5.0, compacto: 5.5, berlina: 5.8, familiar: 5.8, suv: 6.3, monovolumen: 6.0, otros: 6.0}
  hibrido:  {utilitario: 4.6, compacto: 5.0, berlina: 5.3, familiar: 5.3, suv: 5.8, monovolumen: 5.6, otros: 5.4}
  phev:     {otros: 6.5}
  glp:      {otros: 9.0}
  gnc:      {otros: 6.0}
  electrico: {utilitario: 15.5, compacto: 16.5, berlina: 17.0, familiar: 17.5, suv: 19.0, otros: 18.0}
  estado: "gasolina: aproximado (Spritmonitor, ver fiscal.yaml consumo_estimado del perfil personal); resto SUPUESTO sin fuente"
