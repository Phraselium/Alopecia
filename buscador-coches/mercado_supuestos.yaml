vida_util:                 # vida útil esperada (para la penalización por vida restante del coste anual)
  activo: true
  estado: "supuesto documentado: años verificados (Sigrauto, todos los automóviles); km = supuesto de modelización ICCT; diésel escalado con Ricardo-AEA; sin datos por segmento ni por combustible en España (PENDIENTE)"
  fuente: "Sigrauto, edad media de baja 20,44 años (2025) y 21,18 (2024): https://www.sigrauto.com/cuantos-vehiculos-fuera-de-uso-se-tratan-al-ano/evolucion-historica ; DGT Anuario 2024, tabla 57: el 76,6 % de las bajas de turismos tiene 20 años o más ; ICCT 2025 (How clean are electric cars in Europe), vida de 240.000 km (20 años × 12.000) ; Ricardo-AEA para la DG CLIMA 2015, km de vida UK: gasolina 160.000, diésel 208.000 (diésel = 1,3 × gasolina)"
  tabla:
    "*|*": {km: 240000, anios: 20, nota: "ICCT 240.000 km; Sigrauto ≈ 20 años"}
    "diesel|*": {km: 312000, anios: 20, nota: "240.000 × 208.000/160.000 (proporción diésel/gasolina de Ricardo-AEA)"}
    "electrico|*": {km: 240000, anios: 20, nota: "ICCT usa la misma vida para eléctricos; la batería se trata aparte (SOH)"}
