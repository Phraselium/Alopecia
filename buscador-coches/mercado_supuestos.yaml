# ==== BLOQUE ELÉCTRICOS / VIDA ÚTIL (provisional: se sustituye por las cifras con fuente) ====
recarga:                   # eléctricos: €/kWh de cada modo de recarga y reparto por escenario (consultado 01-11-2026)
  escenario_defecto: mixta
  precios:
    casa: {eur_kwh: 0.2739, fecha: "2026-S1", fuente: "Eurostat nrg_pc_204, España, media de todas las bandas (TOT_KWH), todos los impuestos (actualizado 19-10-2026). Sin tarifa valle específica: con valle (PVPC P3 ≈ 0,13-0,16 €/kWh, cálculo propio con REE, impuestos supuestos) o tarifas de VE sería menor"}
    publica_ac: {eur_kwh: 0.38, fecha: "2025-07-01", fuente: "CNMC E/CNMC/003/22 (aprobado 09-06-2026), Figura 15, con datos ICCT; https://www.cnmc.es/sites/default/files/6653179.pdf"}
    publica_dc: {eur_kwh: 0.49, fecha: "2025-07-01", fuente: "CNMC E/CNMC/003/22, Figura 15 (rápida DC; > 150 kW 0,55-0,70 €/kWh en dic-2025, pág. 124)"}
  escenarios:                # reparto de la ENERGÍA recargada (supuesto: no hay dato de reparto de energía para España)
    casa: {casa: 0.90, publica_ac: 0.05, publica_dc: 0.05}
    mixta: {casa: 0.60, publica_ac: 0.20, publica_dc: 0.20}
    publica: {casa: 0.00, publica_ac: 0.50, publica_dc: 0.50}
  fuente_reparto: "SUPUESTO. Mixta 60 % privada: límite inferior del 60-80 % de BCG 2023 (nota 194 de la CNMC) y gridX 2025 (53 % de sesiones en casa + 15 % en el trabajo); el 84 % de usuarios españoles recarga habitualmente en casa (Chargemap 2025, nota 131 de la CNMC)"
