  juego: {utilitario: 280, compacto: 350, berlina: 400, familiar: 380, suv: 540, monovolumen: 400, otros: 400}
  estado: "duración confirmada (OCU); precio del juego SUPUESTO: 4 × ~88 € en 205/55 R16 y 4 × ~135 € en 215/55 R17 (precios de ensayos OCU 2023-2024), sin montaje; utilitario sin dato"
