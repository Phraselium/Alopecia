# BORRADOR: se completa con las fuentes del agente de coste total (ver "estado" de cada bloque).
fecha_consulta: 2026-11-01

precio_energia:            # €/l (gasolina, diésel, GLP) y €/kWh (eléctrico)
  gasolina: 1.717          # media de 612 estaciones de la provincia de Valencia (Geoportal MITECO, 01-11-2026 18:49)
  diesel: 1.859            # gasóleo A, 624 estaciones (misma fuente)
  hibrido: 1.717
  phev: 1.717              # PHEV: se calcula como gasolina con el consumo real del ICCT (sin recarga a diario)
  glp: 1.055               # 49 estaciones (misma fuente)
  gnc: 1.45                # SUPUESTO (el Geoportal da €/kg; no calculado)
  electrico: 0.33834       # SE SUSTITUYE al cargar por el €/kWh del escenario de recarga activo (sección recarga; mixta = 0,6·0,2739 + 0,2·0,38 + 0,2·0,49)
  estado: "confirmado (carburantes y precios eléctricos); el reparto de recarga por escenario es un supuesto"
  fuente: "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/46 ; Eurostat nrg_pc_204 (2026-S1) ; CNMC E/CNMC/003/22 (https://www.cnmc.es/sites/default/files/6653179.pdf, pág. 124)"

desfase_wltp_real:         # consumo real = WLTP × (1 + desfase). ICCT (jun-2026) con datos OBFCM de la UE, 2023
  gasolina: 0.194
  diesel: 0.185
  hibrido: 0.194           # el ICCT no separa HEV de combustión: se aplica el de gasolina
  glp: 0.194               # SUPUESTO = gasolina
  gnc: 0.194               # SUPUESTO = gasolina
  phev: 3.87               # PHEV de gasolina: consumo real 4,87 veces el WLTP (2023)
  estado: confirmado (salvo GLP/GNC, supuesto); eléctricos sin dato OBFCM (PENDIENTE)
  fuente: "https://theicct.org/publication/real-world-co2-emission-values-vehicles-europe-jun26/ (2026-06-02)"

consumo_por_defecto:       # si el anuncio no trae WLTP. l/100 km REALES (kWh/100 km en eléctricos)
