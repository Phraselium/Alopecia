seguro:                    # €/año, perfil estándar (40 años, > 15 años de carnet, sin siniestros). SUPUESTO calibrado:
  # CHECK24 (mayo 2026): prima media de las pólizas CONTRATADAS 390 €/año (todas las modalidades). Kelisto 2T-2026 (presupuestos
  # pedidos, sesgado por jóvenes): terceros ampliado 566,89 €; todo riesgo sin franquicia 3.165,91 €. Sin desglose por segmento
  # ni por perfil (PENDIENTE). Se usa 390 € en terceros ampliado (coches de más de 3 años) y el doble en todo riesgo con
  # franquicia (hasta 3 años), con un multiplicador por segmento (supuesto).
  todo_riesgo_hasta_anios: 3
  todo_riesgo: {utilitario: 700, compacto: 780, berlina: 860, familiar: 820, suv: 860, monovolumen: 780, otros: 780}
  terceros_ampliado: {utilitario: 350, compacto: 390, berlina: 430, familiar: 410, suv: 430, monovolumen: 390, otros: 390}
  estado: SUPUESTO calibrado con CHECK24 y Kelisto
  fuente: "https://seguros.check24.es/wp-content/uploads/2026/06/NdP_La-prima-media-del-seguro-de-coche-baja-en-mayo-hasta-los-390-euros-un-53-menos-que-hace-un-ano.pdf ; https://assets.kelisto.es/press-releases/el-precio-de-los-seguros-de-coche-alcanza-su-maximo-historico-en-el-segundo-trimestre-de-2026.pdf"

mantenimiento_anual:       # €/año = revisión anual media (OCU 2026: 249 €) tomada como gasolina; resto con las diferencias de Solera
  gasolina: 249            # OCU 2026, revisión media en taller oficial
  diesel: 224              # Solera 2024: un eléctrico cuesta -21 % que un diésel y -29 % que un gasolina -> 249·0,71/0,79
  hibrido: 236             # Solera: eléctrico -25 % que un híbrido -> 249·0,71/0,75
  phev: 236                # SUPUESTO = híbrido
  electrico: 177           # 249 · (1 - 0,29)
  glp: 249                 # SUPUESTO = gasolina
  gnc: 249                 # SUPUESTO = gasolina
  estado: "OCU confirmado (revisión); proporciones de Solera probables; solo revisión, sin averías"
  fuente: "https://www.ocu.org/organizacion/prensa/notas-de-prensa/2026/tallerescoches280426 ; https://www.hibridosyelectricos.com/coches/segun-talleres-por-ahora-solo-en-esto-son-mas-rentables-coches-electricos-que-combustion_75238_102.html"

neumaticos:
