# ==== ELÉCTRICOS (recarga y batería) Y VIDA ÚTIL ====
recarga:                   # eléctricos: €/kWh de cada modo de recarga y reparto por escenario (consultado 01-11-2026)
  escenario_defecto: mixta
  precios:
    casa: {eur_kwh: 0.2739, fecha: "2026-S1", fuente: "Eurostat nrg_pc_204, España, media de todas las bandas (TOT_KWH), todos los impuestos (actualizado 19-10-2026). Sin tarifa valle específica: con valle (PVPC P3 ≈ 0,13-0,16 €/kWh, cálculo propio con REE, impuestos supuestos) o tarifas de VE sería menor"}
    publica_ac: {eur_kwh: 0.38, fecha: "2025-07-01", fuente: "CNMC E/CNMC/003/22 (aprobado 09-06-2026), Figura 15, con datos ICCT; https://www.cnmc.es/sites/default/files/6653179.pdf"}
    publica_dc: {eur_kwh: 0.49, fecha: "2025-07-01", fuente: "CNMC E/CNMC/003/22, Figura 15 (rápida DC; > 150 kW 0,55-0,70 €/kWh en dic-2025, pág. 124)"}
  escenarios:                # reparto de la ENERGÍA recargada (supuesto: no hay dato de reparto de energía para España)
    casa: {casa: 0.90, publica_ac: 0.05, publica_dc: 0.05}
    mixta: {casa: 0.60, publica_ac: 0.20, publica_dc: 0.20}
    publica: {casa: 0.00, publica_ac: 0.50, publica_dc: 0.50}
  fuente_reparto: "SUPUESTO. Mixta 60 % privada: límite inferior del 60-80 % de BCG 2023 (nota 194 de la CNMC) y gridX 2025 (53 % de sesiones en casa + 15 % en el trabajo); el 84 % de usuarios españoles recarga habitualmente en casa (Chargemap 2025, nota 131 de la CNMC)"
bateria:
  soh:                       # estado de salud (capacidad útil / nueva) estimado por edad y km; consultado 01-11-2026
    estado: "cifras confirmadas (Geotab, P3/Aviloo, ADAC); combinarlas (el menor de los dos SOH) y aplicar el ajuste de clima cálido a Valencia es SUPUESTO"
    fuente: "Geotab 2025 (22.700 VE, 21 modelos): 2,3 %/año de media (incluye la caída inicial), clima cálido +0,4 %/año — https://www.geotab.com/press-release/ev-battery-health-degradation-fast-charging-study/ ; Geotab 2019: Nissan Leaf 2015 (aire) 4,2 %/año frente a 2,3 % con refrigeración líquida — https://www.maakindustrie.nl/en/artikelen/gemiddeld-23-capaciteitsverlies-per-jaar-voor-elektrische-voertuigen ; P3/Aviloo (más de 7.000 VE): ~95 % a 30.000 km, ~90 % a 100.000 km — https://www.auto-motor-und-sport.de/tech-zukunft/alternative-antriebe/elektroauto-akku-batterie-haltbarkeit-studie-v1/ ; Aviloo 2026: Leaf ZE1 91,2 % a 50.000 km y 86,7 % a 150.000 km, Zoe en el grupo peor — https://evpowered.co.uk/news/which-ev-batteries-last-longest-global-study-reveals-best-and-worst-models-for-battery-life/ ; ADAC ID.3: 93 % a 102.505 km, 89 % a 220.158 km"
    formula: "SOH = MAX(suelo, MIN(1 − pérdida_anual·edad, 1 − pérdida_inicial·MIN(km, km_inicial)/km_inicial − pérdida_10k·MAX(0, km − km_inicial)/10.000))"
    minimo: 0.60              # suelo del modelo (supuesto; las garantías cubren el 70 % a 8 años/160.000 km y Euro 7 exige el 72 %)
    km_inicial: 30000         # caída inicial (formación de la capa SEI), P3/Aviloo
    grupo_defecto: liquida
    grupos:
      liquida: {perdida_anual: 0.027, perdida_inicial: 0.05, perdida_10k_km: 0.004, descripcion: "refrigeración líquida: Geotab 2,3 %/año + 0,4 por clima cálido (Valencia, supuesto); 5 puntos en 30.000 km (P3) y 0,4 por 10.000 km (Aviloo/ADAC 0,33-0,46)"}
      aire: {perdida_anual: 0.046, perdida_inicial: 0.08, perdida_10k_km: 0.0046, descripcion: "refrigeración por aire o batería pequeña del grupo peor de Aviloo (Leaf, Zoe, Renault ZE): Geotab Leaf 4,2 %/año + 0,4 por clima; Aviloo Leaf ZE1 ~8,8 puntos a 50.000 km y 0,46 por 10.000 km"}
    modelos: {"Nissan Leaf": aire, "Renault Zoe": aire, "Renault Fluence": aire, "Renault Kangoo": aire}
  autonomia_wltp:            # autonomía con la batería nueva por versión (año y kWh; patrón del título para Tesla)
    estado: "real = autonomía real de ev-database.org (portada, 01-11-2026); WLTP de evkx.net / evspecifications.com; los anteriores a 2018 se homologaron en NEDC. Modelos sin fila: PENDIENTE (sin penalización)"
    fuente: "https://ev-database.org/ ; https://evkx.net/ ; https://www.evspecifications.com/en/model-driving-range/78033bc ; motorpasion.com, hibridosyelectricos.com, km77.com, prensa BMW"
    factor_real: 0.81         # real/WLTP si la versión no tiene autonomía real: mediana de las versiones con ambas cifras (Leaf 40 0,87; Zoe 50 0,80; e-Golf 0,82; Kona 64 0,81; MG4 51 0,86; Model Y 0,76)
    factor_real_nedc: 0.68    # real/NEDC si solo hay NEDC: Leaf 24 kWh 0,68; Zoe 22 kWh 0,67; smart 451 0,70
    modelos:
