marcas_ocu_2026:
  # Índice de fiabilidad OCU 2026 por marca (0-100). Solo marcas con cifra en la nota de prensa.
  fuente: "https://www.ocu.org/organizacion/prensa/notas-de-prensa/2026/fiabcoches020326 ; https://es.motor1.com/news/789821/ocu-fiabilidad-2026-japoneses-tesla/"
