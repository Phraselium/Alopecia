# Tabla de fiabilidad. NO contiene valores inventados: cada métrica lleva fuente y estado.
#   estado: confirmado | probable (visto en resumen/fragmento, verificar en la fuente) | PENDIENTE
# Consultado: 2026-10-31. Desde este entorno no se pudo abrir adac.de, tuev-verband.de ni ocu.org
# directamente; los valores "probable" salen de resúmenes de prensa de esos informes.
#
# Cobertura: ADAC Pannenstatistik 2026 solo incluye matriculaciones 2016-2023 (2-9 años), así que
# para 2008-2015 la referencia útil es el TÜV Report en las franjas 10-11 y 12-13 años.
#
# Cómo se convierte en puntos (fórmulas en la hoja "Supuestos" del Excel):
#   punt_TÜV = 50 + 100 * (media_franja - Mängelquote) / media_franja, acotado 0-100
#   punt_OCU_marca = índice OCU de la marca (0-100)
#   punt_modelo = media de los disponibles; si no hay ninguno -> neutro (config) y se marca PENDIENTE
#   punt_final = punt_modelo + ajuste_motor + ajuste_combustible, acotado 0-100

