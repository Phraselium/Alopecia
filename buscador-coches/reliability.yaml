plataformas_gemelas:
  # Si un modelo no tiene dato de fiabilidad y su gemelo sí, hereda la puntuación del gemelo marcada "por plataforma".
  - grupo: [Toyota Aygo, Peugeot 107, Citroën C1]
    detalle: "Proyecto B-Zero de Toyota y PSA: plataforma común, fabricados en TPCA Kolín desde 2005; mismo motor de gasolina 1.0 (1KR)"
    estado: confirmado
    fuente: "Nota de prensa de Toyota, 01-12-2004: https://global.toyota/en/detail/221659 (\"Developed on a common platform, all three cars will begin rolling off the line at the TPCA plant in Kolín\")"
  - grupo: [Seat Ibiza, Seat Córdoba, Volkswagen Polo, Skoda Fabia]
    detalle: "Ibiza 6L (2002-2008), Córdoba 6L (2002-2009), Polo 9N (2001-2009) y Fabia I: plataforma PQ24 del grupo VW"
    estado: "confirmado (Ibiza 6L-Polo 9N-Fabia); probable (Córdoba = Ibiza 6L berlina)"
    fuente: "Auto Bild, 'Gebrauchtwagen Seat Ibiza (ab 2002)': https://www.autobild.de/artikel/gebrauchtwagen-seat-ibiza-ab-2002--53502.html (\"Teilt sich der Ibiza ... 6L ... seine Plattform mit dem Polo 9N und dem Skoda Fabia\")"
    nota: "Ibiza, Polo y Fabia ya tienen dato propio; hereda el Córdoba (del Ibiza). El dato ADAC es de matriculaciones 2015 (generación posterior)."

  - grupo: [Audi A4, Seat Exeo]
    detalle: "Seat Exeo (2008-2013) = Audi A4 B7 (plataforma PL46, motores 2.0 TFSI/TDI del A4); la línea de montaje del B7 se trasladó de Ingolstadt a Martorell"
    estado: confirmado
    fuente: "Nota de prensa de SEAT (02-10-2008) reproducida en https://www2020.theautochannel.com/news/2008/10/02/146068.html ; Auto Bild (10-2008): https://www.autobild.de/artikel/seat-exeo-in-paris-789600.html ; https://paultan.org/2008/10/06/seat-exeo-official-photos-and-details/"
    nota: "Ninguno de los dos tiene cifra de fiabilidad propia: el gemelo no aporta puntos hasta tenerla."

cajas_excluidas:
  # Excluidas por defecto (config.yaml -> filtros.excluir_multitronic). Detección en src/pipeline.py:
  #   'multitronic' o 'cvt' en un Audi -> excluido; Audi automático sin 'tiptronic/s tronic/quattro/dsg' -> aviso "posible".
  multitronic:
    nombre: "Audi Multitronic (CVT 01J y 0AW)"
    problema: "Averías de la caja CVT: centralita (TCM), cuerpo de válvulas y la propia caja. En EE. UU., acuerdo colectivo de 2013 que amplió a 10 años/100.000 millas la cobertura (TCM 2003-06, cuerpo de válvulas 2003-04, caja 2002-04) en ~64.000 A4/A4 Cabrio/A6 2002-2006, sin admisión de culpa. En Europa no hay ampliación documentada; Auto Bild recoge averías frecuentes en el A4 B6 (un caso con la 3.ª caja a 38.000 km)."
    estado: "confirmado (EE. UU.); probable (Europa, prensa); 0AW (B8): sin boletín ni dato ADAC encontrado"
    fuente: "https://www.autoblog.com/2013/10/07/audi-cvt-settlement-covers-64000-cars/ (07-10-2013) ; boletines Audi en NHTSA: https://static.nhtsa.gov/odi/tsbs/2013/MC-10123551-9999.pdf , https://static.nhtsa.gov/odi/tsbs/2013/MC-10123545-9999.pdf ; Auto Bild A4 B6: https://www.autobild.de/artikel/audi-a4-ab-2000--44969.html (fecha PENDIENTE)"
    revisar: "Si el anuncio dice 'automático' sin más en un Audi de tracción delantera, preguntar si es Multitronic: en ese caso, descartar."

cajas_robotizadas:
  # Penalización en la fiabilidad (scoring.penalizaciones.caja_robotizada). Detectadas en título/versión.
  patron: "easy-?tronic|\\bmta\\b|dualogic|\\bmmt\\b|2-?tronic|\\betg\\d?\\b|sensodrive|\\bcmp\\b|pilotad\\w*|\\basg\\b|\\bags\\b|speedshift|softouch|selespeed|quickshift|durashift|\\bamt\\b|robotizad\\w*"
  nombres: "Opel Easytronic (MTA), Fiat Dualogic, Toyota MMT, Peugeot 2-Tronic/ETG, Citroën SensoDrive/CMP, VW ASG, Suzuki AGS, smart speedshift/softouch, Alfa Selespeed, Renault Quickshift, Ford Durashift"
  estado: "criterio sin fuente seria de fiabilidad (no hay datos ADAC/TÜV/OCU por tipo de caja)"
  referencia: "km77 sobre la mala fama de las cajas robotizadas por lentitud, imprecisión y brusquedad (no es un dato de averías): https://www.km77.com/revista/?p=14315"
  revisar: "Prueba larga en ciudad: tirones, retraso al iniciar la marcha, ruido del actuador; facturas de embrague/actuador y si se ha hecho la adaptación del embrague"

marcas_ocu_2026:
  # Índice de fiabilidad OCU 2026 por marca (0-100). Solo marcas con cifra en la nota de prensa.
  fuente: "https://www.ocu.org/organizacion/prensa/notas-de-prensa/2026/fiabcoches020326 ; https://es.motor1.com/news/789821/ocu-fiabilidad-2026-japoneses-tesla/"
  estado: probable
  valores: {Lexus: 93, Subaru: 91, Toyota: 91, Suzuki: 91}
