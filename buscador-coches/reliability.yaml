motores:
  # El PROBLEMA está documentado en la fuente; la MAGNITUD del ajuste (puntos) es un criterio de
  # scoring editable, no un dato. marca "(todas)" = aplica a cualquier marca con esa clave de motor.
  - {marca: "(todas)", motor: "1.2 PureTech", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "Correa de distribución húmeda que se degrada y consumo de aceite; Stellantis amplió garantía a 10 años/175.000 km con condiciones",
     revisar: "Factura de cambio de correa y del tamiz/bomba de aceite; nivel de aceite; testigo de presión; si entra en la ampliación de garantía Stellantis",
     estado: probable, fuente: "https://www.km77.com/revista/engendro-mecanico/stellantis-compensacion-afectados-puretech/ ; https://www.motorpasion.com/industria/stellantis-fin-responde-al-problema-motores-puretech-10-anos-garantia-retroactiva"}
  - {marca: "(todas)", motor: "1.0 PureTech", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "Igual que 1.2 PureTech (familia EB)", revisar: "Igual que 1.2 PureTech",
     estado: probable, fuente: "https://www.km77.com/revista/engendro-mecanico/stellantis-compensacion-afectados-puretech/"}
  - {marca: "(todas)", motor: "1.2 VTi", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "1.2 VTi atmosférico = PureTech EB2 (correa húmeda)", revisar: "Igual que 1.2 PureTech",
     estado: probable, fuente: "https://www.km77.com/revista/engendro-mecanico/stellantis-compensacion-afectados-puretech/"}
  - {marca: "(todas)", motor: "1.2 TSI", anio_desde: 2008, anio_hasta: 2012, ajuste: -20,
     problema: "EA111: cadena de distribución que se alarga y tensor que falla; puede saltar y romper el motor",
     revisar: "Ruido metálico en arranque en frío (primeros segundos); factura de cambio de cadena y tensor",
     estado: probable, fuente: "https://www.autobild.de/artikel/vw-steuerketten-kulanz-2892135.html"}
  - {marca: "(todas)", motor: "1.4 TSI", anio_desde: 2008, anio_hasta: 2012, ajuste: -20,
     problema: "EA111: cadena de distribución que se alarga y tensor que falla",
     revisar: "Ruido de cadena en frío; factura de cadena/tensor; consumo de aceite",
     estado: probable, fuente: "https://www.autobild.de/artikel/vw-steuerketten-kulanz-2892135.html"}
  - {marca: "(todas)", motor: "1.0 EcoBoost", anio_desde: 2012, anio_hasta: 2018, ajuste: -20,
     problema: "Correa bañada en aceite que se degrada; fallos de refrigeración y sobrecalentamiento (≈2012-2014)",
     revisar: "Fugas y nivel de refrigerante, manguitos, historial de sobrecalentamiento, factura de correa",
     estado: probable, fuente: "https://www.motor.es/noticias/ford-10-ecoboost-tricilindricos-correas-banadas-2026115650.html ; https://www.whatcar.com/news/ford-ecoboost-engine-recall-%E2%80%93-what-you-need-to-know/n17972"}
  - {marca: "(todas)", motor: "1.2 TCe", anio_desde: 2012, anio_hasta: 2016, ajuste: -20,
     problema: "H5Ft: consumo excesivo de aceite (fabricados 10/2012-07/2016); recalibración desde 06/2015",
     revisar: "Consumo de aceite, humo azul, si se le hizo la actualización de software/campaña",
     estado: probable, fuente: "https://questions.assemblee-nationale.fr/dyn/15/questions/QANR5L15QOSD963.pdf"}
  - {marca: "Opel", motor: "1.4 Turbo", anio_desde: 2010, anio_hasta: 2018, ajuste: -10,
     problema: "A14NET: pistones/segmentos (consumo de aceite, preencendido), ventilación del cárter, cadena. Fuentes secundarias",
     revisar: "Consumo de aceite, tirones, ruido de cadena",
     estado: "probable (fuente secundaria)", fuente: "https://carwiki.de/opel-a14net-motor"}
