motores:
  # El PROBLEMA está documentado en la fuente; la MAGNITUD del ajuste (puntos) es un criterio de
  # scoring editable, no un dato. marca "(todas)" = aplica a cualquier marca con esa clave de motor.
  - {marca: "(todas)", motor: "1.2 PureTech", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "Correa de distribución húmeda que se degrada y consumo de aceite; Stellantis amplió garantía a 10 años/175.000 km con condiciones",
     revisar: "Factura de cambio de correa y del tamiz/bomba de aceite; nivel de aceite; testigo de presión; si entra en la ampliación de garantía Stellantis",
     estado: probable, fuente: "https://www.km77.com/revista/engendro-mecanico/stellantis-compensacion-afectados-puretech/ ; https://www.motorpasion.com/industria/stellantis-fin-responde-al-problema-motores-puretech-10-anos-garantia-retroactiva"}
  - {marca: "(todas)", motor: "1.0 PureTech", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "Igual que 1.2 PureTech (familia EB)", revisar: "Igual que 1.2 PureTech",
     estado: probable, fuente: "https://www.km77.com/revista/engendro-mecanico/stellantis-compensacion-afectados-puretech/"}
  - {marca: "(todas)", motor: "1.2 VTi", anio_desde: 2012, anio_hasta: 2022, ajuste: -25,
     problema: "1.2 VTi atmosférico = PureTech EB2 (correa húmeda)", revisar: "Igual que 1.2 PureTech",
